<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Глеб Карнаухов — Go/C++ Developer</title>
  <desc id="desc">Тёмный терминал с голубым акцентом, анимированным курсором, схемой сервисов и крупным числом 69. Основной язык — Go.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111d30"/></linearGradient>
    <linearGradient id="digits" x2="0.9" y2="1"><stop stop-color="#71e5ff"/><stop offset="1" stop-color="#287ebc"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#80aecb" opacity=".15"/></pattern>
    <clipPath id="card"><rect x="1" y="1" width="998" height="298" rx="16"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    .cursor{animation:blink 1.4s steps(1,end) infinite}
    .packet{stroke-dasharray:7 173;animation:travel 5s linear infinite}
    @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
    @keyframes travel{to{stroke-dashoffset:-180}}
    @media(prefers-reduced-motion:reduce){.cursor,.packet{animation:none}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect x="640" width="360" height="300" fill="url(#grid)"/>
    <path d="M660 46V300" stroke="#284059" stroke-opacity=".55"/>
    <path d="M0 45H1000" stroke="#243249"/>
    <circle cx="26" cy="23" r="4" fill="#44556c"/><circle cx="42" cy="23" r="4" fill="#44556c"/><circle cx="58" cy="23" r="4" fill="#56c9e5"/>
    <text x="82" y="27" class="mono" font-size="11" fill="#99abc1">gleb@github: ~/profile</text>
    <text x="972" y="27" class="mono" font-size="10" fill="#7d91ac" text-anchor="end">karnaukhovGA69</text>
    <text x="38" y="91" class="sans" font-size="20" fill="#bdcce0">Глеб Карнаухов</text>
    <text x="35" y="148" class="sans" font-size="47" font-weight="700" letter-spacing="-1.8" fill="#f0f6fc">Go/C++ Developer</text>
    <text x="39" y="187" class="mono" font-size="16" fill="#65d9f3">&gt; Go first. Backend focused.</text>
    <rect class="cursor" x="320" y="172" width="9" height="18" rx="1" fill="#65d9f3"/>
    <path d="M39 219H598" stroke="#283b52"/>
    <text x="39" y="254" class="mono" font-size="12" letter-spacing="1.2" fill="#98acc5">API  /  SERVICES  /  EVENT-DRIVEN SYSTEMS</text>
    <text x="825" y="215" text-anchor="middle" class="sans" font-size="193" font-weight="750" letter-spacing="-13" fill="url(#digits)" fill-opacity=".1" stroke="url(#digits)" stroke-width="1.4">69</text>
    <path d="M714 256H936" stroke="#284960" stroke-width="1.5"/>
    <path class="packet" d="M714 256H936" stroke="#65d9f3" stroke-width="2.5" fill="none"/>
    <g fill="#101c2e" stroke="#65d9f3" stroke-width="1.4"><rect x="708" y="250" width="12" height="12" rx="3"/><rect x="819" y="250" width="12" height="12" rx="3"/><rect x="930" y="250" width="12" height="12" rx="3"/></g>
  </g>
  <rect x=".5" y=".5" width="999" height="299" rx="16" fill="none" stroke="#2c4058"/>
</svg>
