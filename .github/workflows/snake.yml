name: Update contribution snake

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%230969da&color_dots=%23ebedf0,%23b6e3ff,%2354aeff,%230969da,%230a3069
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2365d9f3&color_dots=%23161b22,%23133345,%231e5770,%233395b0,%2365d9f3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish animations to profile-assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          generated_dir="$GITHUB_WORKSPACE/dist"
          test -s "$generated_dir/github-snake.svg"
          test -s "$generated_dir/github-snake-dark.svg"

          publish_dir="$(mktemp -d)"
          cd "$publish_dir"
          git init --initial-branch=profile-assets
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git

          if git ls-remote --exit-code --heads origin refs/heads/profile-assets > "$RUNNER_TEMP/profile-assets-ref"; then
            git fetch --depth=1 origin profile-assets
            git checkout -B profile-assets FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
          fi

          cp "$generated_dir/github-snake.svg" "$generated_dir/github-snake-dark.svg" .
          git add -- github-snake.svg github-snake-dark.svg
          if git diff --cached --quiet; then
            echo 'Contribution animations are already up to date.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Update contribution snake animations'
          git push origin HEAD:profile-assets
